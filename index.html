<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LTC</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <link rel="icon" href="https://mhmahdavi1391.github.io/VR/logo.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme.css" />
</head>
<body>
    <div class="lang-toggle" id="langToggle">
      <button type="button" data-lang="fa" class="active">FA</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <div class="container" id="app">
        <div class="card animate__animated animate__fadeInUp" id="card">
            <div class="brand">
                <div class="brand-icon"><img src="https://mhmahdavi1391.github.io/VR/logo.jpg" alt="Lumen Technologies Co."></div>
                <div class="brand-text">Lumen Technologies<small data-i18n="brand_sub">سیستم تأیید اصالت</small></div>
            </div>
            <div id="loadingState" class="loader"><div class="spinner"></div><span class="loader-text" data-i18n="loading">در حال بررسی شناسه ...</span></div>
            <div id="resultState" class="hidden fade-in"><div class="status-badge" id="statusBadge"><span class="dot"></span><span id="statusLabel">—</span></div><div class="detail-list" id="detailList"></div></div>
            <div id="errorState" class="hidden error-box"><span class="emoji">⛔</span><h2 id="errorTitle">خطا</h2><p id="errorMessage">مشکلی پیش آمده است.</p></div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="motion.js"></script>
</body>
</html>
