<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="eckEmKRcxO2-v0_uGxKgiAfYmNxzAT6_36wGXXYYWFs" />
    <title>LTC</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <meta name="author" content="Lumen Technologies Co." />
    <meta name="theme-color" content="#fff8f3" />
    <link rel="icon" href="https://mhmahdavi1391.github.io/VR/logo.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      .lang-toggle { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); top: auto; z-index: 50; display: flex; border-radius: 999px; overflow: hidden; border: 1px solid rgba(92,48,140,0.16); background: rgba(255,255,255,0.82); backdrop-filter: blur(18px); }
      .lang-toggle button { border: none; background: transparent; color: #5c4d6e; font-size: 0.75rem; font-weight: 700; padding: 10px 16px; min-width: 52px; min-height: 40px; cursor: pointer; font-family: inherit; }
      .lang-toggle button.active { background: linear-gradient(135deg, #6d4bd6, #ff7a3c); color: #fff; }
      html[dir="ltr"] .lang-toggle { left: 50%; right: auto; }
      html[dir="ltr"] body { direction: ltr; }
      .brand-icon { padding: 0 !important; overflow: hidden; background: #fff !important; border-radius: 16px; }
      .brand-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    </style>
</head>
<body>
    <div class="lang-toggle" id="langToggle"><button type="button" data-lang="fa" class="active">FA</button><button type="button" data-lang="en">EN</button></div>
    <div class="container" id="app">
        <div class="card animate__animated animate__fadeInUp" id="card">
            <div class="brand"><div class="brand-icon"><img src="https://mhmahdavi1391.github.io/VR/logo.jpg" alt="Lumen Technologies Co."></div><div class="brand-text">Lumen Technologies<small data-i18n="brand_sub">سیستم تأیید اصالت</small></div></div>
            <div id="loadingState" class="loader"><div class="spinner"></div><span class="loader-text" data-i18n="loading">در حال بررسی شناسه ...</span></div>
            <div id="resultState" class="hidden fade-in"><div class="status-badge" id="statusBadge"><span class="dot"></span><span id="statusLabel">—</span></div><div class="detail-list" id="detailList"></div><div class="verified-line" data-i18n="verified_by">تأیید شده توسط LTC</div></div>
            <div id="errorState" class="hidden error-box"><span class="emoji">⛔</span><h2 id="errorTitle">خطا</h2><p id="errorMessage">مشکلی پیش آمده است.</p></div>
            <a class="company-btn" href="https://lt-c.iddns.ir/" data-i18n="company_site">سایت شرکت</a>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="motion.js"></script>
</body>
</html>
